<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图标确认 · C4 原版</title>
<style>
  body{margin:0;background:linear-gradient(180deg,#bfe9ff,#8fd14f);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"PingFang SC",sans-serif;padding:20px;box-sizing:border-box}
  h2{color:#3a2e1a;margin:0 0 4px}
  p{color:#3a2e1a;opacity:.7;margin:0 0 18px;font-size:13px;text-align:center}
  .card{background:#fffdf5;border:5px solid #fff;border-radius:32px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  img{width:min(78vw,320px);height:min(78vw,320px);border-radius:22px;display:block}
  .tip{margin-top:16px;color:#3a2e1a;font-size:13px;background:#fffdf5;border-radius:14px;padding:10px 14px;max-width:340px;text-align:center;font-weight:600}
  .meta{margin-top:8px;color:#6b5a3e;font-size:11px}
</style>
</head>
<body>
  <h2>🌳 当前桌面图标：C4 原版</h2>
  <p>蓝天绿地 · 大树 · 粉红果实（未放大版）</p>
  <div class="card"><img src="icon-C4-v1.png" alt="C4 图标原版"></div>
  <div class="meta">文件：icon-C4-v1.png · 这是已设为桌面图标的样子</div>
  <div class="tip">如果这张图和你手机桌面看到的不一样，说明手机缓存了旧图。删掉桌面旧图标，重新「添加到主屏幕」即可变成这张。</div>
</body>
</html>
