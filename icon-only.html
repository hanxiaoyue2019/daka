<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图标长这样</title>
<style>
  body{margin:0;background:linear-gradient(180deg,#bfe9ff,#8fd14f);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"PingFang SC",sans-serif;padding:20px;box-sizing:border-box}
  h2{color:#3a2e1a;margin:0 0 14px}
  .card{background:#fffdf5;border:5px solid #fff;border-radius:32px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  img{width:min(70vw,300px);height:min(70vw,300px);border-radius:18px;display:block}
  .tip{margin-top:16px;color:#3a2e1a;font-size:13px;background:#fffdf5;border-radius:14px;padding:10px 14px;max-width:320px;text-align:center;font-weight:600}
</style>
</head>
<body>
  <h2>🌳 图标实际长这样</h2>
  <div class="card"><img src="/apple-touch-icon.png" alt="图标"></div>
  <div class="tip">如果这张图能正常显示（树+果实），说明图没问题，问题在"添加到主屏幕"读不到临时链接的图。</div>
</body>
</html>
